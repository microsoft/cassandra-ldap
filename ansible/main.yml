- name: Install prerequisite packages
  become: yes
  dnf:
    name:
      - gpgme
      - unzip
      - gawk
      - javapackages-tools
    state: latest
  register: task_register_var
  until: task_register_var is succeeded
  retries: 5

- name: Install pinned msopenjdk-11
  become: yes
  dnf:
    name:
      - msopenjdk-11-11.0.29
    state: present
  register: task_register_var
  until: task_register_var is succeeded
  retries: 5

- name: Install pinned msopenjdk-17 for Cassandra 5.0
  become: yes
  dnf:
    name:
      - msopenjdk-17
    state: present
  register: task_register_var
  until: task_register_var is succeeded
  retries: 5

- name: Create Cassandra directory
  become: yes
  file:
    path: /etc/cassandra
    state: directory

- name: Add cassandra group
  become: yes
  group:
    name: cassandra
    state: present
    gid: 3000

- name: Add cassandra user
  become: yes
  user:
    name: cassandra
    group: cassandra
    state: present
    uid: 3000
    create_home: no
    home: "/nonexistent"
    shell: "/usr/sbin/nologin"

- name: Creates /var/log/cassandra directory
  become: yes
  file:
    path: /var/log/cassandra
    state: directory
    mode: '0755'
    owner: cassandra
    group: cassandra

- name: Creates /usr/share/nova directory
  become: yes
  file:
    path: /usr/share/nova
    state: directory
    mode: '0755'

- name: Creates /usr/share/nova/lib directory
  become: yes
  file:
    path: /usr/share/nova/lib
    state: directory
    mode: '0755'

- name: Creates /usr/share/nova/agent directory
  become: yes
  file:
    path: /usr/share/nova/agent
    state: directory
    mode: '0755'

- name: Creates /usr/share/nova/rpm directory
  become: yes
  file:
    path: /usr/share/nova/rpm
    state: directory
    mode: '0755'

- name: Download cassandra rpm package
  become: yes
  command: >
    az storage blob download
      --account-name {{cassandraArtifactsAccountName}}
      --container-name cassandra
      --name {{ item }}
      --file /usr/share/nova/rpm/{{ item }}
      --auth-mode login 
      --output none
  when: not usingContainers
  register: task_register_var
  until: task_register_var is succeeded
  retries: 5
  with_items:
    - cassandra-3.11.17-1.cm2.x86_64.rpm
    - cassandra-4.0.12-1.cm2.x86_64.rpm
    - cassandra-4.1.4-1.cm2.x86_64.rpm
    - cassandra-5.0.2-1.cm2.x86_64.rpm

- name: Set permission for downloaded cassandra rpm packages
  become: yes
  file:
    path: "/usr/share/nova/rpm/{{ item }}"
    mode: '0644'
  with_items:
    - cassandra-3.11.17-1.cm2.x86_64.rpm
    - cassandra-4.0.12-1.cm2.x86_64.rpm
    - cassandra-4.1.4-1.cm2.x86_64.rpm
    - cassandra-5.0.2-1.cm2.x86_64.rpm

