- name: Install cassandra-env.sh
  become: yes
  template:
    src: cassandra-env.sh.j2
    dest: /home/azureuser/scripts/cassandra-env.sh.template
    owner: cassandra
    group: cassandra
    mode: "0600"

- name: Install logback.xml
  become: yes
  template:
    src: logback.xml.j2
    dest: /home/azureuser/scripts/logback.xml
    owner: cassandra
    group: cassandra
    mode: "0600"

- name: Install cassandra.yaml.template
  become: yes
  template:
    src: cassandra.yaml.template.j2
    dest: /home/azureuser/scripts/cassandra.yaml.template
    owner: azureuser
    group: azureuser
    mode: "0600"

- name: Create service directory
  become: yes
  file:
    path: /etc/systemd/system/cassandra.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# https://unix.stackexchange.com/questions/452284/managing-nproc-in-systemd
# we need both nproc and TasksMax
- name: Copy cassandra service override file
  become: yes
  copy:
    src: "override.conf"
    dest: /etc/systemd/system/cassandra.service.d/
    mode: "0644"

- name: Install audit.yaml
  become: yes
  template:
    src: audit.yaml.j2
    dest: /home/azureuser/scripts/audit.yaml
    owner: cassandra
    group: cassandra
    mode: "0600"

- name: Install pip
  become: yes
  dnf:
    name: python3-pip
    state: latest
  register: task_register_var
  until: task_register_var is succeeded
  retries: 5

- name: Install cqlsh
  become: yes
  pip:
    name: cqlsh

- name: Put telegraf-ioping.sh
  become: yes
  copy:
    src: telegraf-ioping.sh
    dest: /usr/local/bin/telegraf-ioping.sh
    owner: telegraf
    group: telegraf
    mode: "0755"

- name: Put list_cassandra_processes.sh
  become: yes
  copy:
    src: list_cassandra_processes.sh
    dest: /usr/local/bin/list_cassandra_processes.sh
    owner: root
    group: root
    mode: "0755"

- name: Put Telegraf configuration files
  become: yes
  copy:
    src: "{{ item }}"
    dest: /etc/telegraf/telegraf.d/
    owner: telegraf
    group: telegraf
    mode: "0600"
  with_fileglob: "telegraf.d/*"

- name: Put telegraf.conf
  become: yes
  copy:
    src: telegraf.conf
    dest: /etc/telegraf/telegraf.conf
    owner: telegraf
    group: telegraf
    mode: "0644"

- name: Install nginx for prometheus port open to customer
  when: '"cassandra_image" in group_names'
  become: yes
  import_tasks: includes/install_nginx_certs.yml
  vars:
    ca: "{{ system_ca }}"
    server_cert: /etc/nginx/prometheus_cert.pem
    server_key: /etc/nginx/prometheus_key.pem
    port: 9500
    location: /
    server_port: 9443
     # Disable client cert validation so customers can connect
    # easily. This is read only data so hold off on enforcing
    # a client cert for now.
    client_ca_enabled: false
    # limit each unique IP address to the rate 1 request per second
    # 1 megabyte memory zone mylimit used to store the state of each IP address
    rate_limiting_enabled: true
    limit_req_zone: $binary_remote_addr zone=mylimit:1m rate=1r/s
    limit_req: zone=mylimit

- name: Get  metric-collector-for-apache-cassandra
  become: yes
  command: >
    az storage blob download
      --account-name {{cassandraArtifactsAccountName}}
      --container-name 3rdparty
      --name {{ mcac_version }}.tar.gz
      --file /tmp/{{ mcac_version }}.tar.gz
      --auth-mode login 
      --output none
  register: task_register_var
  until: task_register_var is succeeded
  retries: 5

- name: Unarchive metric-collector-for-apache-cassandra
  become: yes
  unarchive:
    src: "/tmp/{{ mcac_version }}.tar.gz"
    dest: "/usr/share/"
    remote_src: yes
  register: task_register_var
  until: task_register_var is succeeded
  retries: 5

- name: Get  metric-collector-for-apache-cassandra beta1
  become: yes
  command: >
    az storage blob download
      --account-name {{cassandraArtifactsAccountName}}
      --container-name 3rdparty
      --name {{ mcac_version_beta1 }}.tar.gz
      --file /tmp/{{ mcac_version_beta1 }}.tar.gz
      --auth-mode login 
      --output none
  register: task_register_var
  until: task_register_var is succeeded
  retries: 5

- name: Unarchive metric-collector-for-apache-cassandra beta1
  become: yes
  unarchive:
    src: "/tmp/{{ mcac_version_beta1 }}.tar.gz"
    dest: "/usr/share/"
    remote_src: yes
  register: task_register_var
  until: task_register_var is succeeded
  retries: 5

- name: Install collectd.conf.tmpl
  become: yes
  copy:
    src: collectd.conf.tmpl
    dest: "{{ item }}"
    mode: "0755"
  with_items:
    - "/usr/share/{{ mcac_version }}/config/"
    - "/usr/share/{{ mcac_version_beta1 }}/config/"

- name: Overwrite metric-collector.yaml
  become: yes
  copy:
    src: metric-collector.yaml
    dest: "{{ item }}"
    mode: "0755"
  with_items:
    - "/usr/share/{{ mcac_version }}/config/"
    - "/usr/share/{{ mcac_version_beta1 }}/config/"

- name: Replace collectd_wrapper
  become: yes
  copy:
    src: collectd_wrapper
    dest: "{{ item }}"
    mode: "0755"
  with_items:
    - "/usr/share/{{ mcac_version }}/lib/collectd/usr/sbin/"
    - "/usr/share/{{ mcac_version_beta1 }}/lib/collectd/usr/sbin/"

- name: Install write_statsd plugin
  become: yes
  copy:
    src: write_statsd.py
    dest: "{{ item }}"
    mode: "0755"
  with_items:
    - "/usr/share/{{ mcac_version }}/lib/collectd/"
    - "/usr/share/{{ mcac_version_beta1 }}/lib/collectd/"

- name: Install statsd
  become: yes
  pip:
    name: statsd
    extra_args: -t /opt/collectd
    umask: "0022"
    version: "{{ statsd_version }}"

- name: Install fluent-logger
  become: yes
  pip:
    name: fluent-logger
    extra_args: -t /opt/collectd
    umask: "0022"
    version: "{{ fluent_logger_version }}"

- name: Install psutil
  become: yes
  pip:
    name: psutil

- name: Install datetime
  become: yes
  pip:
    name: datetime

- name: Install Fluent Bit # TODO: Remove this block when cassandra image is also on az linux 3
  when: '"cassandra_image" in group_names or "jump_image" in group_names'
  become: yes
  dnf:
    name: fluent-bit-3.1.9-1.azl3
    state: present
  register: task_register_var
  until: task_register_var is succeeded
  retries: 5

- name: Install Fluent Bit 3.0.6-1.azl3
  when: '"garnet_jump_image" in group_names' # TODO: Remove this condition when cassandra image is also on az linux 3
  become: yes
  dnf:
    name: fluent-bit-3.1.9-1.azl3
    state: present
  register: task_register_var
  until: task_register_var is succeeded
  retries: 5

- name: Create fluent-bit directory
  become: yes
  file:
    path: /etc/fluent-bit/
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy Fluentbit config files
  become: yes
  copy:
    src: "{{ item }}"
    dest: /etc/fluent-bit/
    mode: "0644"
  with_items:
    - fluent-bit.conf
    - parsers.conf
    - format_azsecpack.lua
    
- name: Fluentbit enabled
  become: yes
  systemd:
    name: fluent-bit
    enabled: yes
    state: stopped

- name: Create nova log dir
  become: yes
  when: '"cassandra_image" in group_names'
  file:
    path: "/var/log/nova"
    state: directory
    owner: cassandra
    group: cassandra
    mode: "0755"

- name: Create nova lib dir
  become: yes
  when: '"cassandra_image" in group_names'
  file:
    path: "/var/lib/nova"
    state: directory
    owner: cassandra
    group: cassandra
    mode: "0755"

